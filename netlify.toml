[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/images/logo-email.png"
  to = "/logo-horizontal.png"
  status = 200

[[headers]]
  for = "/push/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = /

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
